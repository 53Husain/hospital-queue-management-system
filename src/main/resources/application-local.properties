# Opt-in local setup; default application configuration stays unchanged.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:mysql://127.0.0.1:${DB_PORT:3308}/hospital_queue_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=hospital
spring.datasource.password=${DB_PASSWORD}
server.address=127.0.0.1
server.port=${SERVER_PORT:8082}
