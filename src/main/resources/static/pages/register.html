<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet" href="/css/login.css">
</head>

<body>

<div class="container">

    <div class="login-card">

        <h2 class="text-center mb-4">
            Register
        </h2>

        <form id="registerForm">

            <div class="mb-3">
                <label>Full Name</label>
                <input
                        type="text"
                        id="fullName"
                        class="form-control"
                        required>
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input
                        type="email"
                        id="email"
                        class="form-control"
                        required>
            </div>

            <div class="mb-3">
                <label>Phone Number</label>
                <input
                        type="text"
                        id="phone"
                        class="form-control"
                        required>
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input
                        type="password"
                        id="password"
                        minlength="12" maxlength="72"
                        class="form-control"
                        required>
            </div>

            <p>Patient registration. Staff accounts are created by an administrator.</p>

            <button
                    class="btn btn-success w-100">
                Register
            </button>

            <div class="text-center mt-3">
                <a href="/pages/login.html">
                    Already have an account?
                </a>
            </div>

        </form>

    </div>

</div>

<script src="/js/api.js"></script>
<script src="/js/register.js"></script>

</body>
</html>
